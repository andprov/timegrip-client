org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# API base URL baked into the build (can be changed in the app on the sign-in screen).
# Release talks to production. Debug talks to the local development backend
# (`python -m timegrip` in the backend repo, port 8000) through
# `adb reverse tcp:8000 tcp:8000`, which works the same on an emulator and on a
# phone over USB; run it again after the device reconnects or reboots.
timegrip.apiUrl.debug=http://localhost:8000/api/
timegrip.apiUrl.release=https://timegrip.ru/api/
