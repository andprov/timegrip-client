materialIcons = "1.7.8"
navigation = "2.10.2"
room = "2.8.5"
work = "2.12.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
serialization = "1.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxTestRunner = "1.7.0"
